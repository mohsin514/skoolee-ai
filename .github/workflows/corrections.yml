name: Auditable correction invariants
on:
  pull_request:
    branches: [dev, staging, qa, production, demo, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-corrections-only
          POSTGRES_DB: sko213
        ports: ['55413:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:synthetic-corrections-only@127.0.0.1:55413/sko213
      DIRECT_URL: postgresql://postgres:synthetic-corrections-only@127.0.0.1:55413/sko213
      AUTH_SECRET: synthetic-sko213-local-only
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3213
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec next build
      - name: Verify API and browser invariants
        run: |
          pnpm exec next start --hostname 127.0.0.1 --port 3213 > /tmp/corrections-app.log 2>&1 &
          for i in $(seq 1 40); do curl -s http://127.0.0.1:3213/login >/dev/null && break; sleep 1; done
          mkdir -p /private/tmp
          pnpm test:corrections
          pnpm exec playwright install --with-deps chromium
          node tests/corrections/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correction-verification
          path: |
            /tmp/corrections-app.log
            docs/qa/evidence/sko-213
