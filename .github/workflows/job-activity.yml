name: Job activity invariants
on:
  pull_request:
    branches: [dev, staging, qa, production, demo, main]
permissions:
  contents: read
jobs:
  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: sko223
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55423:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:55423/sko223
      DIRECT_URL: postgresql://postgres@127.0.0.1:55423/sko223
      AUTH_SECRET: synthetic-sko223-local-only
      DISABLE_OUTBOUND_MESSAGES: 'true'
      SKO223_KEEP: '1'
      NEXT_PUBLIC_APP_URL: http://localhost:3223
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec tsc --noEmit
      - run: node --import tsx --test tests/jobs/jobs.test.ts
      - run: pnpm exec next build
      - name: Verify actual routes
        run: |
          pnpm exec next start --hostname 127.0.0.1 --port 3223 > /tmp/sko223-app.log 2>&1 &
          for i in $(seq 1 40); do curl -s http://localhost:3223/login >/dev/null && break; sleep 1; done
          node tests/jobs/api.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-activity-verification
          path: |
            /tmp/sko223-app.log
            docs/qa/evidence/sko-223/api.json
