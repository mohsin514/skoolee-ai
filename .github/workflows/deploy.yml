name: Migrate & Deploy
on:
  push:
    branches: [dev, staging, qa, production, demo]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment (must match the selected branch)
        required: true
        type: choice
        options: [dev, staging, qa, production, demo]
permissions:
  contents: read
concurrency:
  group: migrate-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate-target:
    runs-on: ubuntu-latest
    env:
      TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
    steps:
      - name: Validate selected branch
        run: |
          if [ "$TARGET_ENVIRONMENT" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Select the $TARGET_ENVIRONMENT branch when dispatching this environment."
            exit 1
          fi
  development:
    needs: validate-target
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Development uses Vercel Git integration
        run: |
          echo 'Development deploys through the existing Vercel Git integration.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No release approval variables or Vercel CLI secrets are needed in GitHub for dev.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Recovery CI runs independently; it does not gate the Vercel Git build.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job does not migrate the dev database. Apply required versioned migrations before deploying schema-dependent changes; see docs/ENVIRONMENTS.md.' >> "$GITHUB_STEP_SUMMARY"
  recovery:
    needs: validate-target
    uses: ./.github/workflows/recovery.yml
  migrate-and-promote:
    if: github.ref_name != 'dev'
    needs: recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
    env:
      TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
      APPROVED_SHA: ${{ vars.RELEASE_APPROVED_SHA }}
      EVIDENCE_URL: ${{ vars.RELEASE_EVIDENCE_URL }}
      FORWARD_RECOVERY: ${{ vars.FORWARD_RECOVERY_DECISION }}
      AUTO_DEPLOY_DISABLED: ${{ vars.VERCEL_AUTO_DEPLOY_DISABLED }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require destination, reviewed workflow evidence and forward-recovery decision
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$TARGET_ENVIRONMENT" = "$GITHUB_REF_NAME" ] || fail "Selected environment must match the branch."
          [ "$APPROVED_SHA" = "$GITHUB_SHA" ] || fail "Set RELEASE_APPROVED_SHA to this reviewed commit in the GitHub environment."
          [ "$AUTO_DEPLOY_DISABLED" = true ] || fail "Verify automatic Git deployments are disabled, then set VERCEL_AUTO_DEPLOY_DISABLED=true."
          [ -n "$VERCEL_TOKEN" ] || fail "Missing VERCEL_TOKEN environment secret."
          [ -n "$VERCEL_ORG_ID" ] || fail "Missing VERCEL_ORG_ID environment secret."
          [ -n "$VERCEL_PROJECT_ID" ] || fail "Missing VERCEL_PROJECT_ID environment secret."
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_ENVIRONMENT" | cut -f1)" = "$GITHUB_SHA"
          [ "$FORWARD_RECOVERY" = 'approved-forward-repair-or-isolated-restore' ] || fail "Missing reviewed FORWARD_RECOVERY_DECISION; see docs/recovery/RUNBOOK.md."
          case "$EVIDENCE_URL" in https://*) ;; *) echo 'Missing operator evidence link'; exit 1;; esac
          mkdir -p release-evidence
          python3 - <<'PY'
          import json, os
          keys = ['TARGET_ENVIRONMENT', 'APPROVED_SHA', 'EVIDENCE_URL', 'FORWARD_RECOVERY', 'GITHUB_ACTOR', 'GITHUB_RUN_ID']
          with open('release-evidence/decision.json', 'w') as file:
              json.dump({key: os.environ[key] for key in keys}, file, indent=2)
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply immutable versioned migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -o pipefail
          pnpm prisma migrate deploy 2>&1 | python3 scripts/recovery/redact-log.py | tee release-evidence/migrate.log
          pnpm prisma migrate status 2>&1 | python3 scripts/recovery/redact-log.py | tee release-evidence/status.log
          pnpm prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code 2>&1 | python3 scripts/recovery/redact-log.py | tee release-evidence/drift.log
      - name: Build the reviewed checkout after migration gates
        run: |
          set -o pipefail
          pnpm dlx vercel@63.0.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@63.0.0 build --prod --token="$VERCEL_TOKEN" 2>&1 | python3 scripts/recovery/redact-log.py | tee release-evidence/build.log
      - name: Promote the exact prebuilt artifact
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_ENVIRONMENT" | cut -f1)" = "$GITHUB_SHA"
          pnpm dlx vercel@63.0.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN" > release-evidence/deployment-url.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}
          path: release-evidence/
          retention-days: 30
          if-no-files-found: warn
