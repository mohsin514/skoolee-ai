name: Destructive confirmations
on:
  pull_request:
    branches: [dev, staging, qa, production, demo, main]
permissions:
  contents: read
jobs:
  confirmations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['55438:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55438/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:55438/postgres
      AUTH_SECRET: scrum309-ci-synthetic-secret-only-2026
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate && pnpm exec prisma db push
      - run: node --import ./tests/support/server-only.mjs --import tsx --test tests/destructive/version.test.ts tests/destructive/operations.database.test.ts tests/locale/catalog-conflicts.test.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          pnpm exec next dev --webpack -p 3110 > /tmp/confirm-app.log 2>&1 &
          for i in $(seq 1 60); do curl -s http://localhost:3110/api/auth/session > /dev/null && break; sleep 2; done
          node --import ./tests/support/server-only.mjs --import tsx --test --test-concurrency=1 tests/destructive/confirm.browser.test.ts
      - run: pnpm exec playwright test --config tests/design-system/playwright.config.ts tests/design-system/modal-foundation.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: destructive-confirmations-evidence
          path: |
            /tmp/scrum309/evidence
            /tmp/confirm-app.log
