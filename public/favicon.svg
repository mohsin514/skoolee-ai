<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Fully transparent canvas — just the cap and the two "eyes" from the
       Skoolee wordmark, in the brand's white + purple only. No backing
       shape, so it reads as a floating mark rather than a boxed logo.

       The pupils carry a SMIL loop matching the live SkooleeLogo
       component's look-around cycle, so this master asset genuinely
       animates wherever something renders raw SVG (this file is also the
       source for every generated app icon — those are necessarily a single
       static frame, since no OS animates home-screen/dock/taskbar icons). -->

  <!-- Graduation cap -->
  <path
    d="M512 150 866 328 512 506 158 328Z"
    fill="#FFFFFF"
    stroke="#8127CF"
    stroke-width="16"
    stroke-linejoin="round"
  />
  <path d="M866 328V434" stroke="#8127CF" stroke-width="18" stroke-linecap="round"/>
  <circle cx="866" cy="456" r="26" fill="#8127CF"/>

  <!-- Eyes — white with a purple rim; pupils drift in a slow look-around
       loop, same easing shape as the wordmark's look-duration variable -->
  <circle cx="350" cy="690" r="138" fill="#FFFFFF" stroke="#8127CF" stroke-width="22"/>
  <circle cx="674" cy="690" r="138" fill="#FFFFFF" stroke="#8127CF" stroke-width="22"/>

  <g>
    <circle cx="350" cy="690" r="58" fill="#8127CF"/>
    <circle cx="330" cy="668" r="18" fill="#FFFFFF"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; 23,-12; -23,12; 12,6; 0,0"
      keyTimes="0; 0.25; 0.5; 0.75; 1"
      calcMode="spline"
      keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"
      dur="4s"
      repeatCount="indefinite"
    />
  </g>
  <g>
    <circle cx="674" cy="690" r="58" fill="#8127CF"/>
    <circle cx="654" cy="668" r="18" fill="#FFFFFF"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; 23,-12; -23,12; 12,6; 0,0"
      keyTimes="0; 0.25; 0.5; 0.75; 1"
      calcMode="spline"
      keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"
      dur="4s"
      repeatCount="indefinite"
    />
  </g>
</svg>
